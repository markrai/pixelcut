name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: go test -v ./...
      - name: Vet
        run: go vet ./...
      - name: Windows build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pixelcut.exe ./cmd/pixelcut
