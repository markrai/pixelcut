name: Format baseline
on:
  push:
    branches: [refactor/2c-r1-format]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Format tracked Go files
        shell: bash
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git diff --stat
          git diff --check
          git add -- '*.go'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Normalize Go source formatting'
          git push origin HEAD:refactor/2c-r1-format
