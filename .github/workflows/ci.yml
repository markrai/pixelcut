name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: go test -v ./...
      - name: Vet
        run: go vet ./...
      - name: Windows build
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pixelcut.exe ./cmd/pixelcut
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pixelcut-gui.exe ./cmd/pixelcut-gui

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Project model tests
        run: go test -v ./internal/project
      - name: Vet
        run: go vet ./cmd/pixelcut-gui ./internal/project
      - name: Build desktop prototype
        run: go build -o pixelcut-gui.exe ./cmd/pixelcut-gui
