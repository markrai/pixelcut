name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg lua5.4
      - name: Test and coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-reports
          go version | tee ci-reports/environment.txt
          uname -a | tee -a ci-reports/environment.txt
          lscpu | tee -a ci-reports/environment.txt
          ffmpeg -version | tee -a ci-reports/environment.txt
          go test -count=1 -v -coverprofile=ci-reports/coverage-linux.out ./... | tee ci-reports/test-linux.txt
          go tool cover -func=ci-reports/coverage-linux.out | tee ci-reports/coverage-linux.txt
      - name: Visual crop script tests
        run: lua5.4 cmd/pixelcut-gui/crop_test.lua
      - name: Vet
        run: go vet ./...
      - name: Portable race checks
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 ./internal/... | tee ci-reports/race-linux.txt
      - name: Project baseline benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/project -run '^$' -bench '^BenchmarkProjectBaseline$' -benchmem -benchtime=200ms -count=3 | tee ci-reports/benchmarks-linux.txt
      - name: Composition benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/composition -run '^$' -bench '^BenchmarkComposition$' -benchmem -benchtime=200ms -count=3 | tee ci-reports/benchmarks-composition.txt
      - name: Composite preview allocation benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/composition -run '^$' -bench '^BenchmarkCompositePreview' -benchmem -benchtime=200ms -count=3 | tee ci-reports/benchmarks-composite-preview.txt
      - name: HLG linear-light blend benchmark
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/projectexport -run '^$' -bench '^BenchmarkHLGBlend' -benchmem -benchtime=200ms -count=3 | tee ci-reports/benchmarks-hlg-blend.txt
      - name: Windows build
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pixelcut.exe ./cmd/pixelcut
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pixelcut-gui.exe ./cmd/pixelcut-gui
      - name: Upload Linux qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-linux
          path: ci-reports/
          retention-days: 30
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Smoke test local CI launcher
        shell: cmd
        run: ci.bat -FormatOnly
      - name: Verify local CI formatting diagnostics
        shell: powershell
        run: ./scripts/test-ci-format.ps1
      - name: Project model and desktop input tests with coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-reports | Out-Null
          go version | Tee-Object ci-reports/environment.txt
          go test -count=1 -v "-coverprofile=ci-reports/coverage-windows.out" ./internal/project ./internal/projectexport ./internal/editor ./internal/timeline ./internal/composition ./internal/playback ./internal/playback/mpv ./internal/service ./internal/session ./internal/mediacache ./internal/waveform ./internal/thumbnail ./cmd/pixelcut-gui | Tee-Object ci-reports/test-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover "-func=ci-reports/coverage-windows.out" | Tee-Object ci-reports/coverage-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vet
        run: go vet ./cmd/pixelcut-gui ./internal/project ./internal/projectexport
      - name: Build desktop prototype
        run: go build -o pixelcut-gui.exe ./cmd/pixelcut-gui
      - name: Upload Windows qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows
          path: ci-reports/
          retention-days: 30
          if-no-files-found: warn
